<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800"><rect width="640" height="800" fill="white"/><g fill="#182b37" font-family="sans-serif"><text x="40" y="65" font-size="24" font-weight="bold">TÀI LIỆU KIỂM THỬ TỔNG HỢP</text><text x="40" y="110" font-size="16">Không phải bài nộp hoặc bài mẫu thật.</text><text x="40" y="175" font-size="22">Một số vấn đề về cách mạng tư sản</text><text x="40" y="235" font-size="18">1. Tiền đề kinh tế</text><text x="40" y="275" font-size="16">Sự phát triển của công thương nghiệp.</text><text x="40" y="350" font-size="18">2. Chính trị và xã hội</text><text x="40" y="390" font-size="16">Phân tích các mâu thuẫn và mục tiêu.</text><text x="40" y="480" font-size="18">3. Kết luận</text><text x="40" y="520" font-size="16">Giáo viên đối chiếu và tự đưa ra nhận xét.</text></g></svg>
